apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: country-integration
  namespace: country-integration
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: country-integration
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: country-integration
  namespace: country-integration
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: country-integration }
